- action: speak
  args:
    lines:
      - What do you want? I don't have time to talk to you right now. I'm busy with work.
      - Oh, it's you. I guess I can spare a few minutes. What do you need?
- action: displayOptions
  args:
    options:
    - text: I just wanted to check in and see how you're doing. Is everything okay?
      action: speak
      args:
        lines:
          - I'm doing fine, thanks for asking. Just busy with work as usual. 
    - text: I know you've been busy with work, but I wanted to make sure you're taking care of yourself. Do you need any help or support?
      action: speak
      args:
        lines:
          - I'm doing well, but I appreciate the concern. I'll be okay.
          - Thanks for offering, but I think I can handle things on my own.
    - text: I don't know bye
      action: leave
